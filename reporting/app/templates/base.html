<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Family Finances{% endblock %}</title>
    <style>
        :root {
            --ink: #1f2430;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #fafafa;
            --card: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --expense: #b91c1c;
            --income: #15803d;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        nav {
            display: flex;
            gap: 1.25rem;
            padding: 0 2rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        nav a {
            padding: 1rem 0;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid transparent;
        }
        nav a.active { color: var(--primary); border-bottom-color: var(--primary); }
        main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 1.4rem; font-weight: 600; margin: 0; }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .summary { color: var(--muted); font-size: 0.9rem; margin: 0.35rem 0 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 0.7rem 0.9rem;
            text-align: left;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            font-weight: 600;
            color: var(--muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: #f5f5f5;
        }
        tr:last-child td { border-bottom: none; }
        button {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            background: var(--card);
            color: var(--ink);
            font: inherit;
            font-size: 0.85rem;
            cursor: pointer;
        }
        button:hover { background: #f5f5f5; }
        button.primary { border-color: var(--primary); background: var(--primary); color: white; }
        button.primary:hover { background: var(--primary-hover); }
        button.danger { color: var(--expense); }
        .empty {
            padding: 2rem;
            text-align: center;
            color: var(--muted);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        @media (max-width: 650px) {
            nav, main { padding-left: 1rem; padding-right: 1rem; }
            .table-wrap { overflow-x: auto; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/transactions" class="{{ 'active' if request.url.path == '/transactions' else '' }}">Transactions</a>
        <a href="/accounts" class="{{ 'active' if request.url.path == '/accounts' else '' }}">Accounts</a>
        <a href="/categories" class="{{ 'active' if request.url.path == '/categories' else '' }}">Categories</a>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    {% block scripts %}{% endblock %}
</body>
</html>
